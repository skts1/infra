# Nginx rate limiting config — added Sep 5 2026
# Insert this into http { } block of /etc/nginx/nginx.conf

# Rate limit zone: 10 requests/second per IP, burst to 20
limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;
# Connection limit per IP: 50 concurrent
limit_conn_zone $binary_remote_addr zone=conn:10m;

# Add to server block:
# limit_req zone=one burst=20 nodelay;
# limit_conn conn 50;

server {
    listen 443 ssl http2;
    server_name sikrits.com www.sikrits.com;

    # Rate limiting
    limit_req zone=one burst=20 nodelay;
    limit_conn conn 50;

    # Block common exploit paths
    location ~* (wp-admin|wp-login|xmlrpc|phpmyadmin|\.env|\.git) {
        return 444;
    }

    # Existing location / block here
    location / {
        # ... existing config
    }
}
