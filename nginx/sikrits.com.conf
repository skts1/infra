# /etc/nginx/sites-available/sikrits.com
# Reconstituted from public headers (Sep 5, 2026)
# Source: https://www.sikrits.com response headers
# Original VPS: <VPS-IP-B> (Hetzner)

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name sikrits.com www.sikrits.com *.sikrits.com;

    # ACME challenge for Let's Encrypt — do not redirect
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sikrits.com www.sikrits.com *.sikrits.com;

    root /var/www/sikrits.com/public;
    index index.html;

    # === TLS CONFIG (CRITICAL: must include both sikrits.com AND www.sikrits.com) ===
    # Aug 18 lesson: cert with CN=sikrits.com only (no www SAN) caused security warning
    ssl_certificate /etc/letsencrypt/live/sikrits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sikrits.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — observed in response headers (max-age=63072000 = 2 years)
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers — observed in response
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP — observed in response (allows Stripe checkout)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://checkout.stripe.com https://api.stripe.com; frame-src 'self' https://checkout.stripe.com https://js.stripe.com;" always;

    # === ROUTING ===
    # Wildcard *.sikrits.com currently points to nginx default. Override specific subdomains here.
    # Example: if app.sikrits.com should proxy to a backend, add location / {} block.

    location / {
        try_files $uri $uri/ =404;
    }

    # ACME renewal
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
}
