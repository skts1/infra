# HTTP to HTTPS redirect block — added Sep 5 2026 for bulletproof hardening
server {
    listen 80;
    listen [::]:80;
    server_name sikrits.com www.sikrits.com;

    # ACME challenge support (certbot needs port 80)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else: redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
